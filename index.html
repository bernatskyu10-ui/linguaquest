<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1630">
  <title>LinguaQuest - английский шаг за шагом</title>
  <meta name="description" content="LinguaQuest: учите английский с нуля в игровой форме. Работает офлайн, прогресс сохраняется в браузере.">
  <!-- Шрифты с кириллицей (Unbounded для заголовков, Manrope для текста) лежат в проекте -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/webp" href="assets/mascot/fox-face.webp">
  <!-- Установка как приложение (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/mascot/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <!-- Декоративный фон: мягко плавающие фигуры (заполняется из effects.js) -->
  <div class="bg-scene" id="bgScene" aria-hidden="true"></div>

  <!-- Корневой контейнер приложения: экраны рендерятся сюда -->
  <main id="app" class="app" aria-live="polite"></main>

  <!-- Слой для конфетти -->
  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Слой для всплывающих уведомлений (тосты) -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- Модальное окно (общий контейнер) -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>

  <!-- Порядок подключения важен: данные и утилиты раньше логики -->
  <script src="js/data.js"></script>
  <script src="js/svg.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/audio-manifest.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
